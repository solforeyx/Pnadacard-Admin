<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin — News</title>
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="admin.css">
</head>
<body>
  <div id="loginScreen" class="login-screen">
    <div class="login-card">
      <img src="https://i.imgur.com/9aLmHyS.png">
      <h1>Panda<span>Admin</span></h1>
      <input type="email" id="adminEmail" value="solforeyx@gmail.com">
      <input type="password" id="adminPassword" placeholder="Password">
      <button class="btn-primary" onclick="adminLogin()">Login</button>
    </div>
  </div>

  <div id="adminDashboard" class="app-layout hidden">
    <header class="topbar">
      <div class="topbar-left">
        <button class="back-btn" onclick="goToDashboard()"><span class="material-icons">chevron_left</span></button>
        <h1>News</h1>
      </div>
      <div class="topbar-right">
        <span class="user-email current-admin-email"></span>
        <button class="btn-logout" onclick="adminLogout()">Logout</button>
      </div>
    </header>

    <nav class="desktop-nav">
      <a href="index.html" data-roles="owner,staff">Overview</a>
      <a href="money.html" data-roles="owner,staff">Treasury</a>
      <a href="withdrawals.html" data-roles="owner,staff">Withdrawals</a>
      <a href="upload-card.html" data-roles="owner,staff">Cards</a>
      <a href="users.html" data-roles="owner">Users</a>
      <a href="announcements.html" class="active" data-roles="owner">News</a>
      <a href="config.html" data-roles="owner">Config</a>
    </nav>

    <main class="container">
      <div class="section-box">
        <h2><span class="material-icons">campaign</span> New Post</h2>
        <div class="form-group"><label>Title</label><input type="text" id="aTitle"></div>
        <div class="form-group"><label>Message</label><textarea id="aBody" rows="3"></textarea></div>
        <button class="btn-primary" onclick="postNews()">Broadcast</button>
      </div>

      <div class="section-box">
        <h2><span class="material-icons">history</span> Past Posts</h2>
        <table>
          <thead><tr><th>Title</th><th>Action</th></tr></thead>
          <tbody id="newsTable"></tbody>
        </table>
      </div>
    </main>

    <nav class="mobile-nav">
      <a href="index.html"><span class="material-icons">dashboard</span>Home</a>
      <a href="money.html"><span class="material-icons">account_balance</span>Money</a>
      <a href="withdrawals.html"><span class="material-icons">payments</span>Payouts</a>
      <a href="upload-card.html"><span class="material-icons">add_card</span>Cards</a>
      <a href="users.html" data-roles="owner"><span class="material-icons">people</span>Users</a>
    </nav>
  </div>

  <script src="admin.js"></script>
  <script>
    window.loadPageData = async function() {
      const { data } = await sbClient.from('announcements').select('*').order('created_at', { ascending: false });
      document.getElementById('newsTable').innerHTML = (data || []).map(a => `
        <tr>
          <td>${escapeHTML(a.title)}</td>
          <td><button class="btn-sm reject" onclick="delNews('${a.id}')">Del</button></td>
        </tr>
      `).join('');
    };

    async function postNews() {
      const title = document.getElementById('aTitle').value.trim();
      if (!title) return showToast('Title required', 'error');
      const { error } = await sbClient.from('announcements').insert([{
        title: title,
        body: document.getElementById('aBody').value
      }]);
      if (error) return showToast(error.message, 'error');
      showToast('Broadcast Sent!', 'success');
      document.getElementById('aTitle').value = '';
      document.getElementById('aBody').value = '';
      loadPageData();
    }

    async function delNews(id) {
      if (!confirm('Delete?')) return;
      const { error } = await sbClient.from('announcements').delete().eq('id', id);
      if (error) return showToast(error.message, 'error');
      loadPageData();
    }
    window.postNews = postNews;
    window.delNews = delNews;
  </script>
</body>
</html>

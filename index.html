<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin — Overview</title>
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="admin.css">
</head>
<body>

  <div id="loginScreen" class="login-screen">
    <div class="login-card">
      <img src="https://i.imgur.com/9aLmHyS.png">
      <h1>Panda<span>Admin</span></h1>
      <input type="email" id="adminEmail" value="solforeyx@gmail.com">
      <input type="password" id="adminPassword" placeholder="Password">
      <button class="btn-primary" onclick="adminLogin()">Login</button>
    </div>
  </div>

  <div id="adminDashboard" class="app-layout hidden">
    <header class="topbar">
      <div class="topbar-left">
        <h1>Overview</h1>
      </div>
      <div class="topbar-right">
        <span class="user-email current-admin-email"></span>
        <button class="btn-logout" onclick="adminLogout()">Logout</button>
      </div>
    </header>

    <nav class="desktop-nav">
      <a href="index.html" class="active" data-roles="owner,staff">Overview</a>
      <a href="money.html" data-roles="owner,staff">Treasury</a>
      <a href="withdrawals.html" data-roles="owner,staff">Withdrawals</a>
      <a href="upload-card.html" data-roles="owner,staff">Cards</a>
      <a href="users.html" data-roles="owner">Users</a>
      <a href="announcements.html" data-roles="owner">News</a>
      <a href="config.html" data-roles="owner">Config</a>
    </nav>

    <main class="container">
      <div class="grid-stats">
        <div class="stat-card">
          <div class="label">Total Users</div>
          <div class="value" id="statUsers">0</div>
        </div>
        <div class="stat-card">
          <div class="label">Cards Sold</div>
          <div class="value" id="statCards">0</div>
        </div>
        <div class="stat-card">
          <div class="label">Pending Payouts</div>
          <div class="value text-gold" id="statPayouts">0</div>
        </div>
      </div>

      <div class="section-box">
        <h2><span class="material-icons">info</span> Welcome</h2>
        <p style="font-size: 12px; color: var(--text-muted); line-height: 1.5;">Use the navigation to manage users, approve withdrawals, and monitor your treasury.</p>
      </div>
    </main>

    <nav class="mobile-nav">
      <a href="index.html" class="active"><span class="material-icons">dashboard</span>Home</a>
      <a href="money.html"><span class="material-icons">account_balance</span>Money</a>
      <a href="withdrawals.html"><span class="material-icons">payments</span>Payouts</a>
      <a href="upload-card.html"><span class="material-icons">add_card</span>Cards</a>
      <a href="users.html" data-roles="owner"><span class="material-icons">people</span>Users</a>
    </nav>
  </div>

  <script src="admin.js"></script>
  <script>
    window.loadPageData = async function() {
      const { count: u } = await sbClient.from('users').select('*', { count: 'exact', head: true });
      const { count: c } = await sbClient.from('transactions').select('*', { count: 'exact', head: true }).in('type', ['marketplace_buy', 'trade_buy']);
      const { count: p } = await sbClient.from('withdrawals').select('*', { count: 'exact', head: true }).eq('status', 'pending');

      document.getElementById('statUsers').textContent = u || 0;
      document.getElementById('statCards').textContent = c || 0;
      document.getElementById('statPayouts').textContent = p || 0;
    };
  </script>
</body>
</html>

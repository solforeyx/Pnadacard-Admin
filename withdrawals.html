<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin — Withdrawals</title>
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="admin.css">
</head>
<body>
  <div id="loginScreen" class="login-screen">
    <div class="login-card">
      <img src="https://i.imgur.com/9aLmHyS.png">
      <h1>Panda<span>Admin</span></h1>
      <input type="email" id="adminEmail" value="solforeyx@gmail.com">
      <input type="password" id="adminPassword" placeholder="Password">
      <button class="btn-primary" onclick="adminLogin()">Login</button>
    </div>
  </div>

  <div id="adminDashboard" class="app-layout hidden">
    <header class="topbar">
      <div class="topbar-left">
        <button class="back-btn" onclick="goToDashboard()"><span class="material-icons">chevron_left</span></button>
        <h1>Withdrawals</h1>
      </div>
      <div class="topbar-right">
        <span class="user-email current-admin-email"></span>
        <button class="btn-logout" onclick="adminLogout()">Logout</button>
      </div>
    </header>

    <nav class="desktop-nav">
      <a href="index.html" data-roles="owner,staff">Overview</a>
      <a href="money.html" data-roles="owner,staff">Treasury</a>
      <a href="withdrawals.html" class="active" data-roles="owner,staff">Withdrawals</a>
      <a href="upload-card.html" data-roles="owner,staff">Cards</a>
      <a href="users.html" data-roles="owner">Users</a>
      <a href="announcements.html" data-roles="owner">News</a>
      <a href="config.html" data-roles="owner">Config</a>
    </nav>

    <main class="container">
      <div class="section-box">
        <table>
          <thead><tr><th>User / Bank</th><th>Amount</th><th>Action</th></tr></thead>
          <tbody id="wdTable"></tbody>
        </table>
      </div>
    </main>

    <nav class="mobile-nav">
      <a href="index.html"><span class="material-icons">dashboard</span>Home</a>
      <a href="money.html"><span class="material-icons">account_balance</span>Money</a>
      <a href="withdrawals.html" class="active"><span class="material-icons">payments</span>Payouts</a>
      <a href="upload-card.html"><span class="material-icons">add_card</span>Cards</a>
      <a href="users.html" data-roles="owner"><span class="material-icons">people</span>Users</a>
    </nav>
  </div>

  <script src="admin.js"></script>
  <script>
    window.loadPageData = async function() {
      const { data } = await sbClient.from('withdrawals')
        .select('*, users(email, full_name)')
        .eq('status', 'pending')
        .order('requested_at');
      const tbody = document.getElementById('wdTable');
      if (!data || !data.length) {
        tbody.innerHTML = '<tr><td colspan="3" style="text-align:center;">No pending payouts.</td></tr>';
        return;
      }

      tbody.innerHTML = data.map(w => `
        <tr>
          <td>
            <div style="font-weight:600;">${formatMoney(w.net_amount)}</div>
            <div style="font-size:10px; color:var(--text-muted);">${escapeHTML(w.users?.email)}</div>
            <div style="font-size:10px; color:var(--text-muted);">${escapeHTML(w.bank_details?.bank)} - ${escapeHTML(w.bank_details?.account_number)}</div>
          </td>
          <td class="text-gold">${formatMoney(w.amount)}</td>
          <td>
            <button class="btn-sm approve" onclick="processWd('${w.id}', 'approved')">Approve</button>
            <button class="btn-sm reject" onclick="processWd('${w.id}', 'rejected')">Reject</button>
          </td>
        </tr>
      `).join('');
    };

    async function processWd(id, status) {
      if (!confirm(`Mark this as ${status}?`)) return;
      const { error } = await sbClient.from('withdrawals').update({ status, processed_at: new Date() }).eq('id', id);
      if (error) return showToast(error.message, 'error');
      showToast(`Withdrawal ${status}`, 'success');
      loadPageData();
    }
    window.processWd = processWd;
  </script>
</body>
</html>

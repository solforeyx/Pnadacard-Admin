<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin — Config</title>
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="admin.css">
</head>
<body>
  <div id="loginScreen" class="login-screen">
    <div class="login-card">
      <img src="https://i.imgur.com/9aLmHyS.png">
      <h1>Panda<span>Admin</span></h1>
      <input type="email" id="adminEmail" value="solforeyx@gmail.com">
      <input type="password" id="adminPassword" placeholder="Password">
      <button class="btn-primary" onclick="adminLogin()">Login</button>
    </div>
  </div>

  <div id="adminDashboard" class="app-layout hidden">
    <header class="topbar">
      <div class="topbar-left">
        <button class="back-btn" onclick="goToDashboard()"><span class="material-icons">chevron_left</span></button>
        <h1>Config</h1>
      </div>
      <div class="topbar-right">
        <span class="user-email current-admin-email"></span>
        <button class="btn-logout" onclick="adminLogout()">Logout</button>
      </div>
    </header>

    <nav class="desktop-nav">
      <a href="index.html" data-roles="owner,staff">Overview</a>
      <a href="money.html" data-roles="owner,staff">Treasury</a>
      <a href="withdrawals.html" data-roles="owner,staff">Withdrawals</a>
      <a href="upload-card.html" data-roles="owner,staff">Cards</a>
      <a href="users.html" data-roles="owner">Users</a>
      <a href="announcements.html" data-roles="owner">News</a>
      <a href="config.html" class="active" data-roles="owner">Config</a>
    </nav>

    <main class="container">
      <div class="section-box">
        <h2><span class="material-icons">power_settings_new</span> Live Mode</h2>
        <p style="font-size:12px; color:var(--text-muted); margin-bottom:12px;">Toggles real money deposits and signups.</p>
        <select id="liveSelect" onchange="toggleLive()" style="width:100%; padding:12px; border-radius:8px; background:var(--bg); color:white; border:1px solid var(--border); outline:none;">
          <option value="false">OFF (Demo Mode)</option>
          <option value="true">ON (Live Active)</option>
        </select>
      </div>
    </main>

    <nav class="mobile-nav">
      <a href="index.html"><span class="material-icons">dashboard</span>Home</a>
      <a href="money.html"><span class="material-icons">account_balance</span>Money</a>
      <a href="withdrawals.html"><span class="material-icons">payments</span>Payouts</a>
      <a href="upload-card.html"><span class="material-icons">add_card</span>Cards</a>
      <a href="users.html" data-roles="owner"><span class="material-icons">people</span>Users</a>
    </nav>
  </div>

  <script src="admin.js"></script>
  <script>
    window.loadPageData = async function() {
      const { data } = await sbClient.from('app_config').select('*').eq('key', 'live_published').single();
      if (data) document.getElementById('liveSelect').value = data.value;
    };

    async function toggleLive() {
      const val = document.getElementById('liveSelect').value;
      if (!confirm(`Turn Live Mode ${val === 'true' ? 'ON' : 'OFF'}?`)) return;
      const { error } = await sbClient.from('app_config').update({ value: val }).eq('key', 'live_published');
      if (error) return showToast(error.message, 'error');
      showToast('Live Mode Updated', 'success');
    }
    window.toggleLive = toggleLive;
  </script>
</body>
</html>
